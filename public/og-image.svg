<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#feca57"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Japanese wave pattern (bottom) -->
  <path d="M0 520 Q150 480 300 520 Q450 560 600 520 Q750 480 900 520 Q1050 560 1200 520 L1200 630 L0 630 Z" fill="#dc2626" opacity="0.3"/>
  <path d="M0 540 Q150 500 300 540 Q450 580 600 540 Q750 500 900 540 Q1050 580 1200 540 L1200 630 L0 630 Z" fill="#ff6b6b" opacity="0.2"/>
  
  <!-- Torii gate silhouette -->
  <g transform="translate(850, 180)" opacity="0.15">
    <rect x="0" y="0" width="200" height="12" rx="3" fill="white"/>
    <rect x="15" y="12" width="170" height="8" rx="2" fill="white"/>
    <rect x="25" y="20" width="15" height="200" fill="white"/>
    <rect x="160" y="20" width="15" height="200" fill="white"/>
    <rect x="20" y="80" width="160" height="10" fill="white"/>
  </g>
  
  <!-- Cherry blossom decorations -->
  <g transform="translate(100, 80)" opacity="0.4">
    <circle cx="0" cy="0" r="20" fill="#ffb7c5"/>
    <circle cx="15" cy="-25" r="12" fill="#ffb7c5"/>
    <circle cx="-20" cy="-15" r="8" fill="#ffb7c5"/>
    <circle cx="30" cy="10" r="6" fill="#ffb7c5"/>
  </g>
  <g transform="translate(1050, 120)" opacity="0.3">
    <circle cx="0" cy="0" r="15" fill="#ffb7c5"/>
    <circle cx="20" cy="-15" r="10" fill="#ffb7c5"/>
    <circle cx="-10" cy="-25" r="8" fill="#ffb7c5"/>
  </g>
  
  <!-- Rising sun circle -->
  <circle cx="600" cy="300" r="120" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="0.2"/>
  <circle cx="600" cy="300" r="80" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.15"/>
  
  <!-- Main title -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="-2">
    Guía de Viaje a Japón
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="32" fill="url(#accent)" opacity="0.9">
    Frases · Presupuesto · Eventos · Comida · Transporte
  </text>
  
  <!-- Features line -->
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="white" opacity="0.7">
    Traductor con cámara · Mapa interactivo · JR Pass Calculator
  </text>
  
  <!-- Brand -->
  <g transform="translate(600, 460)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="white" opacity="0.9">
      🇯🇵 ViajApp
    </text>
    <text x="0" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16" fill="white" opacity="0.6">
      www.viajapp.app
    </text>
  </g>
</svg>