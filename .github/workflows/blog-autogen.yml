name: Blog Auto-Generation

on:
  schedule:
    # Run daily at 10:00 UTC (19:00 JST)
    - cron: "0 10 * * *"
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check if should generate (every 4+ days since newest post)
        id: check
        run: |
          # Get the newest post date from blog-generated.ts
          NEWEST=$(node -e "
            const fs = require('fs');
            try {
              const c = fs.readFileSync('src/lib/blog-generated.ts', 'utf-8');
              const m = c.match(/\[[\s\S]*\]/);
              const posts = m ? JSON.parse(m[0]) : [];
              const dates = posts.map(p => p.date ? new Date(p.date).getTime() : 0).filter(Boolean);
              console.log(dates.length ? Math.max(...dates) : 0);
            } catch (e) { console.log(0); }
          ")
          NOW=$(date +%s)
          DIFF=999
          if [ "$NEWEST" != "0" ]; then
            DIFF=$(( (NOW - NEWEST) / 86400 ))
          fi

          echo "Newest post timestamp: $NEWEST"
          echo "Days since newest post: $DIFF"

          if [ "$DIFF" -ge 4 ]; then
            echo "should_generate=true" >> $GITHUB_OUTPUT
          else
            echo "should_generate=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate blog post
        if: steps.check.outputs.should_generate == 'true'
        run: npx ts-node --compiler-options '{"module":"commonjs"}' scripts/generate-blog.ts

      - name: Check for changes
        id: changes
        if: steps.check.outputs.should_generate == 'true'
        run: |
          if git diff --quiet src/lib/blog-generated.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.should_generate == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "blog-bot"
          git config user.email "blog@viajapp.app"
          git add src/lib/blog-generated.ts
          git commit -m "feat(blog): auto-generate article [skip ci]"
          git push
