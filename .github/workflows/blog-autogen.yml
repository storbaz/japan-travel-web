name: Blog Auto-Generation

on:
  schedule:
    # Run daily at 10:00 UTC (19:00 JST)
    - cron: "0 10 * * *"
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check if should generate (random 3-10 day interval)
        id: check
        run: |
          # Get last commit date of blog-generated.ts
          LAST_COMMIT=$(git log -1 --format="%at" -- src/lib/blog-generated.ts 2>/dev/null || echo "0")
          NOW=$(date +%s)
          DIFF=$(( (NOW - LAST_COMMIT) / 86400 ))
          
          # Random threshold between 3-10 days
          THRESHOLD=$(( (RANDOM % 8) + 3 ))
          
          echo "Days since last post: $DIFF"
          echo "Threshold: $THRESHOLD"
          
          if [ "$DIFF" -ge "$THRESHOLD" ]; then
            echo "should_generate=true" >> $GITHUB_OUTPUT
          else
            echo "should_generate=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate blog post
        if: steps.check.outputs.should_generate == 'true'
        run: npx ts-node scripts/generate-blog.ts

      - name: Check for changes
        id: changes
        if: steps.check.outputs.should_generate == 'true'
        run: |
          if git diff --quiet src/lib/blog-generated.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.should_generate == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "blog-bot"
          git config user.email "blog@viajapp.app"
          git add src/lib/blog-generated.ts
          git commit -m "feat(blog): auto-generate article [skip ci]"
          git push
