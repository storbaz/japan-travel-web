name: Blog Auto-Generation

on:
  # PAUSADO: la autogeneracion de posts se ha detenido para cumplir con las
  # politicas de AdSense (contenido escalado). Solo se puede lanzar manualmente.
  # schedule:
  #   - cron: "0 10 * * *"
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check if should generate (random interval of 3-7 days)
        id: check
        run: |
          # Compute days since newest post entirely in Node (units: both ms)
          DIFF=$(node -e "
            const fs = require('fs');
            try {
              const c = fs.readFileSync('src/lib/blog-generated.ts', 'utf-8');
              const m = c.match(/export const generatedBlogPosts: BlogPost\[\] = (\[[\s\S]*\]);/);
              const posts = m ? JSON.parse(m[1]) : [];
              const dates = posts.map(p => p.date ? new Date(p.date).getTime() : 0).filter(Boolean);
              const newest = dates.length ? Math.max(...dates) : 0;
              const diff = newest ? Math.floor((Date.now() - newest) / 86400000) : 999;
              console.log(diff < 0 ? 0 : diff);
            } catch (e) { console.log(999); }
          ")
          NOW=$(date +%s)
          echo "Days since newest post: $DIFF"

          # Random threshold between 3 and 7 days
          MIN=3
          MAX=7
          THRESHOLD=$(( MIN + RANDOM % (MAX - MIN + 1) ))

          echo "Random interval for this run: $THRESHOLD days"

          if [ "$DIFF" -ge "$THRESHOLD" ]; then
            echo "should_generate=true" >> $GITHUB_OUTPUT
          else
            echo "should_generate=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate blog post
        if: steps.check.outputs.should_generate == 'true'
        run: npx ts-node --compiler-options '{"module":"commonjs"}' scripts/generate-blog.ts

      - name: Check for changes
        id: changes
        if: steps.check.outputs.should_generate == 'true'
        run: |
          if git diff --quiet src/lib/blog-generated.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.should_generate == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "blog-bot"
          git config user.email "blog@viajapp.app"
          git add src/lib/blog-generated.ts
          git commit -m "feat(blog): auto-generate article [skip ci]"
          git push
